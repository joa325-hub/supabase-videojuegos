<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Videojuegos - Búsqueda Supabase</title>
  <!-- Enlace a la hoja de estilos externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Catálogo de Videojuegos</h1>

  <!-- Contenedor principal -->
  <div class="container">
    
    <!-- Barra de búsqueda -->
    <div class="search-container">
      <input 
        type="text" 
        id="input-busqueda" 
        placeholder="Buscar videojuego por título o género..." 
        autocomplete="off"
      >
    </div>

    <div class="table-container">
      <table id="tabla-videojuegos">
        <thead>
          <tr>
            <th>ID</th>
            <th>Título</th>
            <th>Género</th>
            <th>Plataforma</th>
            <th>Año</th>
            <th>Calificación</th>
          </tr>
        </thead>
        <tbody id="tbody-contenido">
          <tr>
            <td colspan="6" id="loading">Cargando registros desde Supabase...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Enlace al archivo JavaScript externo -->
  <script src="app.js"></script>

</body>
</html>
